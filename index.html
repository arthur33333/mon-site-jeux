<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mon Portail de Jeux Arcade</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: #f8fafc; padding: 20px; }
    h1 { text-align: center; margin-bottom: 30px; color: #38bdf8; }
    
    /* Grille de jeux */
    .games-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
    .game-card { background: #1e293b; border-radius: 12px; overflow: hidden; cursor: pointer; transition: transform 0.2s, box-shadow 0.2s; border: 1px solid #334155; }
    .game-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(56, 189, 248, 0.2); }
    .game-card img { width: 100%; height: 160px; object-fit: cover; }
    .game-card h3 { padding: 15px; font-size: 1.1rem; text-align: center; color: #e2e8f0; }

    /* Modal / Fenêtre du jeu */
    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); justify-content: center; align-items: center; z-index: 1000; }
    .modal-content { position: relative; width: 90%; max-width: 900px; height: 80vh; background: #000; border-radius: 8px; overflow: hidden; }
    .close-btn { position: absolute; top: -40px; right: 0; color: white; font-size: 30px; cursor: pointer; font-weight: bold; }
    iframe { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>

  <h1>🎮 Mon Arcade Web</h1>

  <div class="games-grid" id="grid"></div>

  <!-- Lecteur de jeu en iframe -->
  <div class="modal" id="gameModal">
    <div class="modal-content">
      <span class="close-btn" onclick="closeGame()">&times;</span>
      <iframe id="gameFrame" src=""></iframe>
    </div>
  </div>

  <script>
    // 💡 AJOUTEZ VOS JEUX GAMEDISTRIBUTION ET GAMEPIX ICI
    const games = [
      {
        title: "Subway Surfers (Exemple)",
        image: "https://via.placeholder.com/300x200/38bdf8/ffffff?text=Jeu+1",
        iframeUrl: "https://html5.gamedistribution.com/" // Remplacez par votre lien de jeu GameDistribution
      },
      {
        title: "Moto X3M (Exemple)",
        image: "https://via.placeholder.com/300x200/f59e0b/ffffff?text=Jeu+2",
        iframeUrl: "https://games.gamepix.com/" // Remplacez par votre lien de jeu GamePix
      }
    ];

    const grid = document.getElementById('grid');
    const modal = document.getElementById('gameModal');
    const iframe = document.getElementById('gameFrame');

    // Affichage automatique des cartes
    games.forEach(game => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.innerHTML = `<img src="${game.image}" alt="${game.title}"><h3>${game.title}</h3>`;
      card.onclick = () => openGame(game.iframeUrl);
      grid.appendChild(card);
    });

    function openGame(url) {
      iframe.src = url;
      modal.style.display = 'flex';
    }

    function closeGame() {
      modal.style.display = 'none';
      iframe.src = '';
    }
  </script>
</body>
</html>
