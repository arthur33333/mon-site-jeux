<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcadePulse - Jeux en ligne gratuits</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b1329;
      color: #f8fafc;
      padding: 30px 20px;
      min-height: 100vh;
    }

    header {
      text-align: center;
      margin-bottom: 40px;
    }

    header h1 {
      color: #38bdf8;
      font-size: 2.5rem;
      letter-spacing: 1px;
    }

    header p {
      color: #94a3b8;
      margin-top: 8px;
      font-size: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
      max-width: 1000px;
      margin: 0 auto;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.4);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px -3px rgba(56, 189, 248, 0.3);
    }

    .card img {
      width: 100%;
      height: 160px;
      object-fit: cover;
      display: block;
      background-color: #0f172a;
    }

    .card-title {
      padding: 16px;
      font-weight: 600;
      font-size: 1.1rem;
      text-align: center;
      background-color: #1e293b;
    }
  </style>
</head>
<body>

  <header>
    <h1>ArcadePulse</h1>
    <p>Jouez aux meilleurs jeux en ligne gratuits</p>
  </header>

  <main class="grid">
    <a href="https://gamedistribution.com" target="_blank" rel="noopener" class="card">
      <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80" alt="Subway Surfers">
      <div class="card-title">Subway Surfers</div>
    </a>

    <a href="https://gamedistribution.com" target="_blank" rel="noopener" class="card">
      <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=600&q=80" alt="Moto X3M">
      <div class="card-title">Moto X3M</div>
    </a>
  </main>

</body>
</html>
