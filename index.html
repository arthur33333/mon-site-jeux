<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcadePulse - Jeux en ligne gratuits</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    body {
      background-color: #0f172a;
      color: #f8fafc;
      padding: 20px;
    }
    header {
      text-align: center;
      margin-bottom: 30px;
    }
    header h1 {
      color: #38bdf8;
      font-size: 2rem;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 20px;
      max-width: 1000px;
      margin: 0 auto;
    }
    .card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      text-decoration: none;
      color: inherit;
    }
    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 10px 15px -3px rgba(56, 189, 248, 0.3);
    }
    .card img {
      width: 100%;
      height: 140px;
      object-fit: cover;
      display: block;
    }
    .card-title {
      padding: 12px;
      font-weight: bold;
      text-align: center;
    }
  </style>
</head>
<body>

  <header>
    <h1>ArcadePulse</h1>
  </header>

  <main class="grid">
    <a href="https://gamedistribution.com" target="_blank" class="card">
      <img src="https://img.gamedistribution.com/b801a309f4464c18a5948fcf70977461-512x512.jpeg" alt="Subway Surfers">
      <div class="card-title">Subway Surfers</div>
    </a>

    <a href="https://gamedistribution.com" target="_blank" class="card">
      <img src="https://img.gamedistribution.com/5c0e1fa6bc1e4d5fb83f5872df89ee0f-512x512.jpeg" alt="Moto X3M">
      <div class="card-title">Moto X3M</div>
    </a>
  </main>

</body>
</html>
