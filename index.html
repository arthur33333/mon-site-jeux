<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ArcadePulse - Jeux en Ligne Gratuits</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background-color: #0b1329;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    header {
      background-color: #0f172a;
      border-bottom: 1px solid #1e293b;
      padding: 20px;
      text-align: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
    }

    header h1 {
      color: #38bdf8;
      font-size: 2.2rem;
      font-weight: 800;
      letter-spacing: 1px;
      margin-bottom: 5px;
    }

    header p {
      color: #94a3b8;
      font-size: 0.95rem;
      margin-bottom: 20px;
    }

    .controls {
      max-width: 1000px;
      margin: 0 auto;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: space-between;
      align-items: center;
    }

    .search-box {
      padding: 10px 16px;
      border-radius: 20px;
      border: 1px solid #334155;
      background: #1e293b;
      color: #fff;
      outline: none;
      width: 100%;
      max-width: 300px;
      font-size: 0.9rem;
    }

    .categories {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .cat-btn {
      background: #1e293b;
      color: #94a3b8;
      border: 1px solid #334155;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.2s;
    }

    .cat-btn.active, .cat-btn:hover {
      background: #38bdf8;
      color: #0f172a;
      border-color: #38bdf8;
      font-weight: bold;
    }

    main {
      flex: 1;
      max-width: 1100px;
      width: 100%;
      margin: 30px auto;
      padding: 0 20px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(230px, 1fr));
      gap: 25px;
    }

    .card {
      background: #1e293b;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.4);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      display: flex;
      flex-direction: column;
      border: 1px solid #334155;
    }

    .card:hover {
      transform: translateY(-6px);
      box-shadow: 0 10px 20px rgba(56, 189, 248, 0.25);
      border-color: #38bdf8;
    }

    .card img {
      width: 100%;
      height: 150px;
      object-fit: cover;
      background-color: #0f172a;
    }

    .card-info {
      padding: 15px;
      text-align: center;
    }

    .card-title {
      font-weight: bold;
      font-size: 1rem;
      color: #f8fafc;
    }

    .card-tag {
      font-size: 0.75rem;
      color: #38bdf8;
      margin-top: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      z-index: 1000;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .modal-content {
      background: #0f172a;
      width: 100%;
      max-width: 900px;
      height: 80vh;
      border-radius: 12px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid #38bdf8;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.3);
    }

    .modal-header {
      padding: 15px 20px;
      background: #1e293b;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .modal-title {
      font-weight: bold;
      color: #38bdf8;
    }

    .close-btn {
      background: #ef4444;
      color: white;
      border: none;
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
    }

    .modal iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    footer {
      background: #0f172a;
      border-top: 1px solid #1e293b;
      text-align: center;
      padding: 20px;
      color: #64748b;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>ArcadePulse</h1>
    <p>Jouez directement en ligne – Sans téléchargement</p>
    
    <div class="controls">
      <input type="text" id="searchInput" class="search-box" placeholder="Rechercher un jeu..." onkeyup="filterGames()">
      <div class="categories">
        <button class="cat-btn active" onclick="filterCategory('all', this)">Tous</button>
        <button class="cat-btn" onclick="filterCategory('action', this)">Action</button>
        <button class="cat-btn" onclick="filterCategory('course', this)">Course</button>
        <button class="cat-btn" onclick="filterCategory('sport', this)">Sport</button>
      </div>
    </div>
  </header>

  <main>
    <div class="grid" id="gamesGrid">
      
      <div class="card" data-category="action" data-title="subway surfers" onclick="playGame('Subway Surfers', 'https://html5.gamedistribution.com/b801a309f4464c18a5948fcf70977461/')">
        <img src="https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=600&q=80" alt="Subway Surfers">
        <div class="card-info">
          <div class="card-title">Subway Surfers</div>
          <div class="card-tag">Action / Runner</div>
        </div>
      </div>

      <div class="card" data-category="course" data-title="moto x3m" onclick="playGame('Moto X3M', 'https://html5.gamedistribution.com/5c0e1fa6bc1e4d5fb83f5872df89ee0f/')">
        <img src="https://images.unsplash.com/photo-1558981806-ec527fa84c39?auto=format&fit=crop&w=600&q=80" alt="Moto X3M">
        <div class="card-info">
          <div class="card-title">Moto X3M</div>
          <div class="card-tag">Course / Stunt</div>
        </div>
      </div>

      <div class="card" data-category="action" data-title="temple run 2" onclick="playGame('Temple Run 2', 'https://html5.gamedistribution.com/f104d4128f7344bb8357a701a35368a8/')">
        <img src="https://images.unsplash.com/photo-1511512578047-dfb367046420?auto=format&fit=crop&w=600&q=80" alt="Temple Run 2">
        <div class="card-info">
          <div class="card-title">Temple Run 2</div>
          <div class="card-tag">Action</div>
        </div>
      </div>

      <div class="card" data-category="sport" data-title="basketball stars" onclick="playGame('Basketball Stars', 'https://html5.gamedistribution.com/6b8c8d35661a4f0b83e3c155554f67c2/')">
        <img src="https://images.unsplash.com/photo-1546519638-68e109498ffc?auto=format&fit=crop&w=600&q=80" alt="Basketball Stars">
        <div class="card-info">
          <div class="card-title">Basketball Stars</div>
          <div class="card-tag">Sport</div>
        </div>
      </div>

      <div class="card" data-category="course" data-title="drift boss" onclick="playGame('Drift Boss', 'https://html5.gamedistribution.com/9a5840bd837f485e9fa0ef2701b9795e/')">
        <img src="https://images.unsplash.com/photo-1511919884226-fd3cad34687c?auto=format&fit=crop&w=600&q=80" alt="Drift Boss">
        <div class="card-info">
          <div class="card-title">Drift Boss</div>
          <div class="card-tag">Course</div>
        </div>
      </div>

      <div class="card" data-category="sport" data-title="8 ball pool" onclick="playGame('8 Ball Pool', 'https://html5.gamedistribution.com/f8f411b023f04d7088b6dfc406085a6e/')">
        <img src="https://images.unsplash.com/photo-1534423861386-85a16f5d13fd?auto=format&fit=crop&w=600&q=80" alt="8 Ball Pool">
        <div class="card-info">
          <div class="card-title">8 Ball Pool</div>
          <div class="card-tag">Sport</div>
        </div>
      </div>

    </div>
  </main>

  <div class="modal" id="gameModal">
    <div class="modal-content">
      <div class="modal-header">
        <span class="modal-title" id="modalTitle">Nom du Jeu</span>
        <button class="close-btn" onclick="closeGame()">Fermer ✖</button>
      </div>
      <iframe id="gameFrame" src="" allowfullscreen></iframe>
    </div>
  </div>

  <footer>
    <p>&copy; 2026 ArcadePulse. Tous droits réservés. Jouez gratuitement aux meilleurs jeux HTML5.</p>
  </footer>

  <script>
    function playGame(title, url) {
      document.getElementById('modalTitle').innerText = title;
      document.getElementById('gameFrame').src = url;
      document.getElementById('gameModal').style.display = 'flex';
    }

    function closeGame() {
      document.getElementById('gameModal').style.display = 'none';
      document.getElementById('gameFrame').src = '';
    }

    function filterGames() {
      let input = document.getElementById('searchInput').value.toLowerCase();
      let cards = document.getElementsByClassName('card');

      for (let i = 0; i < cards.length; i++) {
        let title = cards[i].getAttribute('data-title');
        if (title.includes(input)) {
          cards[i].style.display = "flex";
        } else {
          cards[i].style.display = "none";
        }
      }
    }

    function filterCategory(cat, btn) {
      let buttons = document.getElementsByClassName('cat-btn');
      for (let b of buttons) b.classList.remove('active');
      btn.classList.add('active');

      let cards = document.getElementsByClassName('card');
      for (let card of cards) {
        if (cat === 'all' || card.getAttribute('data-category') === cat) {
          card.style.display = "flex";
        } else {
          card.style.display = "none";
        }
      }
    }
  </script>
</body>
</html>
